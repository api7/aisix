# Flake-hunt stress loop for the aisix-proxy unit suite — manual only.
#
# Repeats the suite many times per shard under two conditions:
#   - cov4:   cargo llvm-cov, default test threads — the ci.yml unit job's
#             conditions, where the auth log-capture flake was seen on main.
#   - fast64: plain cargo test with --test-threads=64 — heavy in-process
#             concurrency, which reproduced the mcp minute-window race.
#
# Runs on any push to a `ci-stress/**` branch (push events use the workflow
# file at the pushed ref, so this never needs to exist on main): put the code
# to stress plus this file on such a branch and push. workflow_dispatch is
# kept for the day this lands on the default branch, where it becomes
# dispatchable against arbitrary refs.
name: stress-proxy

on:
  push:
    branches: ["ci-stress/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to check out and stress (default: this branch)"
        required: false
        default: ""
      iterations:
        description: "iterations per shard"
        required: false
        default: "30"
      testfilter:
        description: "test name filter passed to the harness"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  stress:
    name: stress (${{ matrix.mode }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # covws mirrors the real ci.yml unit job (whole-workspace llvm-cov,
        # multiple test binaries in parallel) at ~10min/iteration, so it gets
        # a reduced iteration count in the loop below.
        mode: [cov4, fast64, covws]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: which ref
        run: git log -1 --oneline
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-llvm-cov
        if: matrix.mode == 'cov4' || matrix.mode == 'covws'
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: stress loop
        # Actions runs `run:` under `bash -e`: a bare failing command kills
        # the step before any failure-dump logic executes (learned the hard
        # way — the first hunt run swallowed its own verdict). Capture rc
        # with `|| rc=$?` so the dump always runs.
        run: |
          set -uo pipefail
          iters="${{ inputs.iterations || '40' }}"
          filter="${{ inputs.testfilter || '' }}"
          if [ "${{ matrix.mode }}" = "covws" ] && [ "$iters" -gt 10 ]; then
            iters=10
          fi
          for i in $(seq 1 "$iters"); do
            echo "::group::iteration $i"
            rc=0
            case "${{ matrix.mode }}" in
              cov4)   cargo llvm-cov --no-report -p aisix-proxy --lib -- $filter >/tmp/out.log 2>&1 || rc=$? ;;
              covws)  cargo llvm-cov --no-report --workspace --all-features -- $filter >/tmp/out.log 2>&1 || rc=$? ;;
              *)      cargo test -p aisix-proxy --lib -- --test-threads=64 $filter >/tmp/out.log 2>&1 || rc=$? ;;
            esac
            tail -3 /tmp/out.log
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "FAILED on iteration $i (mode ${{ matrix.mode }}, shard ${{ matrix.shard }})"
              grep -B5 -A60 -E "panicked|FAILED|capture_logs" /tmp/out.log | head -400
              exit 1
            fi
          done
          echo "clean: $iters iterations (mode ${{ matrix.mode }}, shard ${{ matrix.shard }})"
