[package]
name = "aisix-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aisix: Hub-and-Bridge gateway core (ChatFormat, BridgeContext, SSE parser)"

[dependencies]
aisix-core = { path = "../aisix-core" }
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
reqwest.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
http.workspace = true
dashmap.workspace = true
tracing.workspace = true
base64.workspace = true
url.workspace = true
# The environment-proxy matcher reqwest itself uses, so `ssrf` knows which
# caller-supplied URLs a proxy will take, and the CONNECT tunnel reqwest
# itself uses, for the outbound paths that dial without reqwest.
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy", "client-legacy", "tokio"] }
# `upstream_dial`: the CONNECT tunnel above is a tower `Service`, and an
# `https://` proxy is reached over rustls directly.
tower-service = "0.3"
tokio-rustls.workspace = true
# Outbound TLS trust (upstream_tls): the non-reqwest outbound stacks need
# the root store assembled directly, so the rustls side is a direct dep.
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pemfile.workspace = true
webpki-roots.workspace = true
# Only for the Bedrock HTTP stack, behind the `aws` feature so a build
# that excludes Bedrock does not pull the AWS crates in through here.
aws-smithy-http-client = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true }
# Bedrock authentication (`aws_auth`): the default credential chain and STS.
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sdk-sts = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }

[features]
default = []
# Enables `upstream_tls::aws_http_client`, so Bedrock clients share the
# deployment's outbound trust roots. Turned on by the crates that build
# AWS SDK clients (aisix-provider-bedrock, aisix-guardrails/bedrock).
aws = [
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-runtime-api",
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sdk-sts",
    "dep:aws-smithy-types",
]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
rcgen.workspace = true
tempfile.workspace = true
