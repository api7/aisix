[package]
name = "aisix-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aisix: /v1/* proxy router (OpenAI-compatible) + middleware + hooks"

[dependencies]
aisix-a2a = { path = "../aisix-a2a" }
aisix-core = { path = "../aisix-core" }
aisix-gateway = { path = "../aisix-gateway" }
# Mounts the downstream-facing `/mcp` MCP gateway endpoint (mcp.rs): the
# proxy builds an `McpGateway` from the snapshot's `mcp_servers` per request.
aisix-mcp = { path = "../aisix-mcp" }
# /v1/messages handler reaches into the Anthropic wire helpers
# (parse_inbound_request / chat_response_into_anthropic_json /
# AnthropicSseEncoder) so it can translate Anthropic-protocol
# requests into ChatFormat for any upstream and back. The
# Anthropic-passthrough branch also reaches into aisix-provider-openai's
# `overrides::apply_*` primitives so the PK `request.*` block (param
# renames, constraints, default body fields, default headers) takes
# effect on outbound `/v1/messages` requests — without this the
# override pipeline silently no-ops on the Anthropic path (#335 /
# #337). These two crates are the only provider crates the proxy
# depends on directly — others stay behind the Bridge trait.
aisix-provider-anthropic = { path = "../aisix-provider-anthropic" }
aisix-provider-openai = { path = "../aisix-provider-openai" }
aisix-obs = { path = "../aisix-obs" }
aisix-ratelimit = { path = "../aisix-ratelimit" }
aisix-cache = { path = "../aisix-cache" }
aisix-guardrails = { path = "../aisix-guardrails" }
# NOTE: the `local-model-guardrail` feature below forwards to
# aisix-guardrails/local-model so `kind: "semantic"` rows can be
# exercised in this crate's tests; the server crate enables it by
# default (#1363).
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
# Inbound OIDC/JWT verification on the proxy auth path (jwt.rs). Same
# major as the vertex provider's service-account signer. `aws_lc_rs`
# resolves to the same aws-lc-rs version already installed as the
# process-wide rustls provider — version-unified, not a parallel
# crypto backend.
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
tower.workspace = true
tower-http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
# Token-estimation fallback for usage telemetry (token_estimate.rs).
tiktoken-rs.workspace = true
futures.workspace = true
tokio-tungstenite.workspace = true
async-trait.workspace = true
async-stream = "0.3"
dashmap.workspace = true
base64.workspace = true
# Scheme validation of provider-supplied redirect targets on
# `GET /v1/videos/:id/content` (already in the tree via reqwest).
url.workspace = true
# Per-request weighted-random target selection in `routing::weighted_pick`.
# `thread_rng()` gives proper per-request entropy that converges to the
# configured weights over a finite sample (fix for #197 — the prior
# nanos-clock-mod-total entropy collapsed to a single bin under
# rapid-fire calls because consecutive subsec_nanos values differ by
# a constant that aliases against the modulus).
rand = { workspace = true }
chrono.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
# Real-ip resolver: trusted-proxy CIDR matching for x-forwarded-for (#492)
ipnet.workspace = true
# Audio duration for the transcription cost basis: an upstream that
# answers `text`/`srt`/`vtt` reports no `usage`, so the duration is read
# off the uploaded file instead. Metadata-only (no decoding), and
# default-features-off drops the id3v2 zlib path we never need.
lofty.workspace = true

[dev-dependencies]
# `test-util` drives the SSE-heartbeat tests on a paused clock.
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
# aisix-provider-anthropic + aisix-provider-openai moved to
# [dependencies] so the /v1/messages handler can use their primitives
# in non-test builds too.
wiremock.workspace = true
# Captures the auth-denial log lines so their per-request fields are pinned.
tracing-subscriber.workspace = true

[features]
# Forwarded to the guardrails crate so `kind: "semantic"` rows resolve
# to a real runtime guardrail (#1363). The server crate enables this by
# default; it is a feature here only so `cargo test -p aisix-proxy`
# stays buildable without the ONNX Runtime link.
local-model-guardrail = ["aisix-guardrails/local-model"]
