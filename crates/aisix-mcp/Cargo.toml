[package]
name = "aisix-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aisix: MCP gateway — upstream client + downstream-facing aggregating endpoint (Streamable HTTP)"

[dependencies]
aisix-core = { path = "../aisix-core" }
# For `client_builder()`: the upstream connection settings (connect
# timeout, TCP keepalive, pool expiry) are process-wide, so this
# crate's outbound calls share them too.
aisix-gateway = { path = "../aisix-gateway" }
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Upstream OAuth 2.0 client-credentials token minting (`crate::oauth`) plus
# header types for the `api_key` transport headers.
http.workspace = true
reqwest.workspace = true
# rmcp 1.8.0 builds its transport on the reqwest 0.13 line (the workspace is
# on 0.12) and does not re-export it. This renamed dep resolves to the same
# crate version rmcp links, and is used for two things: naming
# `StreamableHttpError<reqwest::Error>` when downcasting a connect failure to
# detect an upstream 401 (the downcast sees the identical type), and building
# `shared_http_client()` — the client handed to every rmcp transport with the
# deployment's `upstream.*` settings applied. Kept `default-features = false`:
# TLS comes in through rmcp's own `reqwest?/rustls` feature unification. The
# 401-invalidation integration test fails loudly if the versions ever stop
# unifying.
rmcp-reqwest = { package = "reqwest", version = "0.13", default-features = false }
# Token-cache keying: the client secret is folded into the cache key as a
# SHA-256 digest so a rotated secret never reuses the previous secret's token.
sha2.workspace = true
hex.workspace = true
# Path-parameter encoding for OpenAPI-backed tool calls (`crate::openapi`).
percent-encoding.workspace = true

# Official MCP Rust SDK. Pinned exactly: rmcp is <2 years old and still
# ships breaking changes on a roughly-monthly cadence, so we hold a fixed
# version and keep all rmcp types behind this crate's own surface (the
# `McpBridge` trait and the gateway DTOs) to absorb API drift.
#
# The 3.x line implements the MCP 2026-07-28 revision (stateless serving,
# `resultType`, cache hints, `Mcp-Method`/`Mcp-Name` header validation) and
# passes the official conformance suite's dated 2026-07-28 core suites.
#
# The gateway is dual-role — an MCP client to upstream servers AND an MCP
# server to downstream agents — so both the `client` and `server` halves are
# production dependencies.
[dependencies.rmcp]
version = "=3.1.2"
default-features = false
features = [
    "client",
    "server",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    # `transport-streamable-http-client-reqwest` only wires `dep:reqwest`
    # with NO TLS backend; rmcp gates rustls behind its separate `reqwest`
    # feature (`reqwest?/rustls`). Without this, `https://` upstreams — i.e.
    # every real authenticated upstream — fail to connect. rustls matches the
    # workspace TLS posture (reqwest 0.12 already uses rustls-tls elsewhere).
    "reqwest",
    "transport-streamable-http-server",
]

[dev-dependencies]
aisix-core = { path = "../aisix-core" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum.workspace = true
async-trait.workspace = true
# Raw-HTTP wire-shape assertions in tests/protocol_generations.rs: real
# clients hide the headers and envelope details those tests pin.
reqwest.workspace = true
