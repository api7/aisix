[package]
name = "aisix-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aisix — the single binary"

[[bin]]
name = "aisix"
path = "src/main.rs"

[dependencies]
aisix-core = { path = "../aisix-core" }
aisix-etcd = { path = "../aisix-etcd" }
aisix-gateway = { path = "../aisix-gateway" }
aisix-obs = { path = "../aisix-obs" }
aisix-proxy = { path = "../aisix-proxy" }
aisix-guardrails = { path = "../aisix-guardrails" }
aisix-admin = { path = "../aisix-admin" }
aisix-provider-openai = { path = "../aisix-provider-openai" }
aisix-provider-anthropic = { path = "../aisix-provider-anthropic" }
aisix-provider-vertex = { path = "../aisix-provider-vertex" }
aisix-provider-azure-openai = { path = "../aisix-provider-azure-openai" }
aisix-provider-bedrock = { path = "../aisix-provider-bedrock" }
aisix-ratelimit = { path = "../aisix-ratelimit" }
aisix-cache = { path = "../aisix-cache", features = ["redis"] }
tokio.workspace = true
axum.workspace = true
axum-server.workspace = true
rustls.workspace = true
clap.workspace = true
config.workspace = true
serde.workspace = true
serde_json.workspace = true
# `aisix export` emits the resources file with the same YAML library the
# file source parses with, so the output is guaranteed to re-parse.
yaml-rust2.workspace = true
anyhow.workspace = true
tracing.workspace = true
etcd-client.workspace = true
reqwest.workspace = true
rcgen.workspace = true
uuid.workspace = true
hostname.workspace = true
x509-parser = "0.16"
# `SO_REUSEPORT` for the thread-per-core proxy listeners. `all` is
# explicit because `set_reuse_port` lives behind it — it resolves
# without the feature today only because other dependencies happen to
# enable it on the same socket2, which a version bump would end.
socket2 = { version = "0.5", features = ["all"] }
# Only for the hyper connection builder `axum_server::Server::http_builder()`
# hands back — where `downstream.idle_timeout_secs` is applied. Same 0.1.x
# axum-server itself depends on, so the builder types unify.
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }

# jemalloc as the global allocator, only on the targets we ship and
# bench (Linux glibc — the Docker image and both supported production
# arches). Other targets (macOS dev builds, musl) keep the system
# allocator rather than carry an allocator we never run in production.
# The ctl crate exists for one runtime mallctl at startup (enable the
# background purge thread, #968); it drags in the unmaintained `paste`
# proc-macro (RUSTSEC-2024-0436, build-time only) — accepted until
# jemalloc-ctl drops it upstream.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = "0.6"

[features]
# Local CPU embedding-model guardrail MVP (AISIX-Cloud#1331). Off by
# default (statically links ONNX Runtime); the guardrail additionally
# activates only when GUARDRAIL_LOCAL_MODEL_DIR is set (non-AISIX_
# prefix on purpose: the config loader claims the AISIX_* env namespace
# and strictly rejects unknown fields).
local-model-guardrail = ["aisix-guardrails/local-model"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["test-util"] }
