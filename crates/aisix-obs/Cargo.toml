[package]
name = "aisix-obs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aisix: observability (tracing, metrics, access log, OTLP export)"

[dependencies]
aisix-core = { path = "../aisix-core" }
# For `client_builder()`: exporter HTTP clients share the process-wide
# connection settings like every other outbound call.
aisix-gateway = { path = "../aisix-gateway" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-util.workspace = true
crossbeam-queue.workspace = true
quanta.workspace = true
bytes.workspace = true
regex.workspace = true
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
uuid.workspace = true
parking_lot.workspace = true
# Object-storage sink (S3/GCS/Azure behind one `ObjectStore` trait). `chrono`
# renders the date-partitioned object key; `flate2` gzips NDJSON before upload.
object_store.workspace = true
chrono.workspace = true
flate2.workspace = true
sha2.workspace = true
hex.workspace = true
# Aliyun SLS sink — official protobuf + signature sub-crates (pure-Rust),
# lz4 block compression, and `http` types for sign_v1. Transport is reqwest
# (rustls), so no native-tls / OpenSSL is pulled in.
http.workspace = true
aliyun-log-sdk-protobuf.workspace = true
aliyun-log-sdk-sign.workspace = true
lz4_flex.workspace = true
# `/proc`-free page size, clock ticks and fd limit for the `process_*` gauges.
rustix.workspace = true
# Names automatic heap dumps after the host, so replicas can share a volume.
hostname.workspace = true

# Allocator statistics and heap profiles, on the targets that run jemalloc
# (see `aisix-server`). `pprof_util` + `mappings` are the pieces of
# `jemalloc_pprof` 0.8 that turn a jemalloc dump into symbolized pprof,
# used directly because that crate can only dump through the system temp
# directory, which a read-only root filesystem does not have.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemalloc-ctl = { version = "0.6", features = ["stats", "profiling", "use_std"] }
pprof_util = { version = "0.8", features = ["symbolize"] }
mappings = "0.7"
# The symbolizer `pprof_util` resolves through; its cache is dropped after
# each dump (see `heap_profile::dump_locked`).
backtrace = "0.3"

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
futures.workspace = true
# `test-util` plays the delivery retry ladder out on a paused clock: the
# budget is minutes of wall time and the cases assert where each attempt
# lands in it.
tokio = { workspace = true, features = ["test-util"] }
