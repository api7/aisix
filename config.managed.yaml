# AISIX gateway — managed-mode bootstrap configuration for AISIX Cloud.
#
# Baked into the official Docker image as `/etc/aisix/config.managed.yaml`.
# Select it by setting `AISIX_CONFIG_PATH` to that path.
# Only the bare minimum is set here:
#
#   - `managed.enabled: true`           always on in this bootstrap configuration
#   - `etcd.endpoints: [placeholder]`   overridden at boot from managed
#                                       CP endpoint config
#   - `admin.admin_keys: [placeholder]` validation requires the slot,
#                                       but the admin listener is never
#                                       bound in managed mode
#
# Operators inject these env vars at `docker run` time:
#
#   AISIX_MANAGED__CP_BASE_URL=https://api.us.aisix.cloud
#   AISIX_MANAGED__CP_ETCD_ENDPOINT=etcd.us.aisix.cloud:7943
#   AISIX_MANAGED__CP_CERT_PEM=...
#   AISIX_MANAGED__CP_KEY_PEM=...
#   AISIX_MANAGED__CP_CA_PEM=...
#
# Plus optionally `AISIX_PROXY__ADDR`, `AISIX_OBSERVABILITY__LOG_LEVEL`,
# `AISIX_CACHE__BACKEND`, etc. — every config field is reachable via
# `AISIX_<UPPER>__<UPPER>` (see crates/aisix-core/src/config.rs).
#
# For a multi-replica deployment, enable cluster-level rate limiting so
# the cluster enforces one global window instead of N× per replica
# (api7/AISIX-Cloud#798):
#   AISIX_RATELIMIT__BACKEND=redis
#   AISIX_RATELIMIT__REDIS__URL=redis://<host>:6379
#
# Subsequent boots re-use the mTLS bundle written under
# `managed.mtls_dir`.

etcd:
  # Placeholder — overwritten at boot before opening the gRPC channel.
  endpoints:
    - "https://placeholder-overridden-at-register:2379"
  prefix: "/aisix"
  # Both timeouts are unset by default, and unset means unbounded; `0`
  # means unbounded as well — the same reading a model's `timeout: 0`
  # gets. (A model's `stream_timeout: 0` instead falls back to the next
  # level of a resolution chain these flat startup keys do not have.)
  # `dial_timeout_ms` bounds the whole dial — the TCP connect, the TLS
  # handshake above it and the authentication exchange when `user` is
  # set — and an expired dial is retried, not fatal;
  # `request_timeout_ms` bounds a
  # single request/response call (the configuration range read, creating
  # the watch, the admin reads) but never the established watch stream. A
  # `request_timeout_ms` the range read cannot finish inside makes the
  # gateway retry it forever without ever serving traffic, so leave it
  # unset unless a slow etcd must fail fast.
  # dial_timeout_ms: 5000
  # request_timeout_ms: 5000

proxy:
  addr: "0.0.0.0:3000"
  # 0 = no request-body cap (the default); set a value to bound
  # per-request memory.
  # request_body_limit_bytes: 0
  # Serving topology; on for Linux by default. A managed deployment
  # reaches these through the environment rather than by editing this
  # file: AISIX_PROXY__THREAD_PER_CORE, AISIX_PROXY__WORKERS.
  # thread_per_core: true
  # workers: 4
  # Headers a caller may hand the gateway its own request id in; that id
  # then becomes the x-aisix-request-id response header, the request_id on
  # every attempt's usage event, and what the upstream sees. Defaults to
  # ["x-aisix-request-id"]. Add x-request-id only if the gateway is NOT
  # behind a proxy that stamps it. Comma-separated from the environment:
  # AISIX_PROXY__REQUEST_ID__ACCEPT_HEADERS=x-aisix-request-id,x-request-id
  # request_id:
  #   accept_headers: ["x-aisix-request-id"]
  # Entry-level URL rewriting (first matching rule wins; `match` runs on
  # the raw, percent-encoded path; `rewrite` replaces the matched portion,
  # $1 = capture group; the query string is preserved). Lets clients keep
  # legacy URL shapes, e.g. per-server MCP paths served on the
  # /mcp/{server} endpoint. When configuring through env vars only, set
  # one JSON array: AISIX_PROXY__URL_REWRITES='[{"match":"...","rewrite":"..."}]'
  # url_rewrites:
  #   - name: per-server-mcp-compat
  #     match: "^/mcp-servers/([^/]+)/mcp$"
  #     rewrite: "/mcp/$1"

admin:
  # Bind to an unbindable port so even if managed mode somehow
  # toggled off, the admin surface wouldn't accidentally come up
  # without an operator-supplied key.
  addr: "127.0.0.1:0"
  admin_keys:
    - "managed-mode-admin-disabled"

observability:
  service_name: "aisix"
  log_level: "info"
  access_log: true
  metrics:
    prometheus:
      enabled: true
      path: "/metrics"
      # Dedicated metrics listener — the only Prometheus scrape surface,
      # the same in every deployment mode. Expose this port in your
      # deployment and point Prometheus at it. Override with
      # AISIX_OBSERVABILITY__METRICS__PROMETHEUS__ADDR.
      addr: "0.0.0.0:9090"
    # Optional User-Agent -> client_type mapping rules for the
    # aisix_llm_tokens_by_client_total metric (first match wins, tried
    # before the built-in allowlist; regex, case-insensitive). See
    # config.example.yaml for the full annotation.
    # client_type_rules:
    #   - pattern: "^py-billing-batcher/"
    #     client: billing-batcher
    # Optional per-metric histogram bucket edges, in seconds; each metric
    # keeps its own default when unset. See config.example.yaml for the
    # full annotation and the cardinality/contract caveats. Override with
    # a comma-separated list, e.g.
    # AISIX_OBSERVABILITY__METRICS__BUCKETS__REQUEST_TTFT=0.1,0.5,1,5,30,300
    # buckets:
    #   request_ttft: [0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 30, 60, 120, 300]

managed:
  enabled: true
  # CP URL, etcd endpoint, and cert bundle come from env vars — never
  # bake secrets into the image.
  mtls_dir: "/var/lib/aisix/mtls"
  dp_id_file: "/var/lib/aisix/dp_id"
  # On-disk snapshot cache (prd-09 §9.7.2). The supervisor writes the
  # last-known etcd contents here on every successful resync / put /
  # delete, and re-loads it at boot before opening the etcd connection
  # — so the proxy stays up across CP outages and full restarts.
  # Set to "" to disable.
  snapshot_cache_path: "/var/lib/aisix/config_cache.json"

  # Heartbeat interval, in seconds. The DP POSTs a heartbeat to
  # dp-manager every interval; the CP marks the DP "connected" on its
  # first heartbeat. Clamped to [5, 300]. Default 15s; lower it (e.g. 5s)
  # in dev/e2e so connect detection isn't bound by the interval.
  heartbeat_interval_secs: 15

cache:
  backend: "memory"

# Connection-layer settings for outbound calls to LLM providers. Shown
# with their defaults; uncomment to override. `pool_idle_timeout_secs`
# is the one to lower when a load balancer, NAT gateway, or service mesh
# between this DP and the provider closes idle connections sooner than
# the gateway expires them — the symptom is intermittent transport
# errors against an otherwise healthy upstream.
upstream:
  # timeout_ms: 6000000
  # stream_timeout_ms: 0
  # connect_timeout_ms: 5000
  # tcp_keepalive_secs: 60
  # tcp_keepalive_interval_secs: 30
  # tcp_keepalive_retries: 5
  pool_idle_timeout_secs: 30
  # pool_max_idle_per_host: 32
  # Trust settings for every upstream TLS handshake — model endpoints,
  # guardrail services, MCP / A2A upstreams, OIDC discovery, Realtime,
  # Bedrock, log-export object stores. `ca_file` is additive to the
  # platform trust store, so trusting a private CA leaves the public
  # providers reachable. See config.example.yaml for the full block.
  # tls:
  #   ca_file: "/etc/aisix/tls/private-ca.pem"
  #   # client_cert_file / client_key_file for mutual TLS
  #   # verify: true   # false accepts ANY certificate — test use only

# Connection-layer settings for the inbound side. `idle_timeout_secs: 0`
# (the default) never closes an idle client connection, leaving that to
# the peer — set it only when a node in front pools connections for a
# known, shorter time, and keep it above that value.
downstream:
  idle_timeout_secs: 0
  # sse_keepalive_interval_secs: 15

# Between SIGTERM and exit the gateway keeps accepting for at least
# `min_drain_secs` while /readyz already reports 503, so the load balancer
# in front has time to withdraw it, then waits for in-flight requests to
# finish before closing the listener. Raise it above the detection latency
# of your balancer's health check. In-flight drain itself is unbounded, so
# terminationGracePeriodSeconds must cover two requests back to back: a
# streamed response commits its head at the first token, so a stream
# already running at SIGTERM never gets the `Connection: close` that
# retires its connection, and the client reuses that connection once more
# before the successor's head — generated during the drain — ends the
# chain. See the aisix Helm chart's "Termination and draining" section.
shutdown:
  min_drain_secs: 30
