[workspace]
resolver = "2"
members = [
    "crates/aisix-a2a",
    "crates/aisix-core",
    "crates/aisix-etcd",
    "crates/aisix-gateway",
    "crates/aisix-mcp",
    "crates/aisix-provider-openai",
    "crates/aisix-provider-anthropic",
    "crates/aisix-provider-vertex",
    "crates/aisix-provider-azure-openai",
    "crates/aisix-provider-bedrock",
    "crates/aisix-proxy",
    "crates/aisix-admin",
    "crates/aisix-obs",
    "crates/aisix-ratelimit",
    "crates/aisix-cache",
    "crates/aisix-redis",
    "crates/aisix-guardrails",
    "crates/aisix-server",
]
# Build-time tool for the PGO release pipeline (#967): own manifest + lockfile,
# never part of the product build graph.
exclude = ["bench/pgo-training/trainer"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/moonming/ai-gateway"
authors = ["moonming"]

[workspace.dependencies]
# Runtime
tokio = { version = "1.41", features = ["full"] }
futures = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
async-trait = "0.1"

# HTTP server
axum = { version = "0.7", features = ["macros", "ws", "tracing", "multipart"] }
# The gateway serves its own accept loop on hyper directly; see
# `serve_http` in aisix-server for why neither `axum::serve` nor
# `axum_server` can express what the listener has to do.
hyper = { version = "1", features = ["server", "http1", "http2"] }
# Declared only to hold a floor: hyper asks for `h2 = "0.4.6"`, and
# anything below 0.4.14 resets every in-flight request on a
# connection whose peer answers our GOAWAY with one of its own —
# see the HTTP/2 branch of `serve_connection`. No code names it.
h2 = "0.4.19"
tokio-rustls = "0.26"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "compression-gzip", "set-header"] }
http = "1.2"
http-body-util = "0.1"
# Trusted-proxy CIDR matching for real-ip resolution (#492)
ipnet = "2"

# Audio properties (duration) for the transcription cost basis. Reads
# container/codec headers only — no decoding, no C dependency — and
# default-features-off drops the id3v2 zlib support we never exercise.
lofty = { version = "0.24", default-features = false }

# Aliyun SLS sink (aisix-obs): the official protobuf + signature sub-crates
# ONLY — not the full `aliyun-log-rust-sdk`, which forces reqwest native-tls
# (OpenSSL) + ~13 C/TLS crates. Transport is our own rustls reqwest, so these
# stay pure-Rust with no OpenSSL.
aliyun-log-sdk-protobuf = "0.1"
aliyun-log-sdk-sign = "0.2"
lz4_flex = "0.11"

# HTTP client.
#
# `rustls-tls-native-roots` is load-bearing and must stay declared here:
# it is what makes `SSL_CERT_FILE` / `SSL_CERT_DIR` work at all, and what
# makes the platform trust store additive to the compiled-in Mozilla set.
# It used to arrive only by feature unification from `object_store`'s
# `aws` feature, so dropping the log-export sink would have silently
# stopped the gateway trusting anything the operating system trusts
# (api7/aisix#860).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "gzip", "multipart"] }

# TLS. The root-store crates are direct dependencies because the
# outbound paths that are not reqwest — the Realtime WebSocket — have to
# assemble the same trust store by hand (aisix-gateway::upstream_tls).
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "0.26"

# Serialization / validation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Collects the paths of fields serde ignored during deserialization —
# how the etcd loader reports unknown fields from a newer control plane
# as "partially compatible" instead of dropping them silently (#871).
serde_ignored = "0.1"
jsonschema = "0.28"
schemars = "0.8"

# Local token estimation for usage telemetry when the upstream response
# carries no usage block (AISIX-Cloud#1074). BPE ranks are bundled; no
# network access at runtime.
tiktoken-rs = "0.12"

# Concurrency primitives
arc-swap = "1.7"
dashmap = "6.1"
once_cell = "1.20"
parking_lot = "0.12"

# etcd
etcd-client = { version = "0.14", features = ["tls"] }

# Config
config = { version = "0.14", default-features = false, features = ["yaml", "toml", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
# Standalone resources-file source (aisix-core::filesource). Same YAML
# parser the `config` dependency already pulls in, so this adds no new
# parser to the dependency tree.
yaml-rust2 = "0.8"

# Time / IDs
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
hostname = "0.4"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Errors / utilities
anyhow = "1"
thiserror = "1"
bytes = "1"
rand = "0.8"
regex = "1"
base64 = "0.22"
url = "2"
percent-encoding = "2"

# Crypto (M6 v3 CP register flow + ApiKey hash auth)
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
hex = "0.4"

# Caching / storage backends
moka = { version = "0.12", features = ["future"] }
# The TLS features are what make a `rediss://` URL connect at all: without
# them redis-rs rejects the scheme at parse time with "can't connect with
# TLS, the feature is not enabled", so every TLS Redis deployment failed at
# boot (api7/aisix#860). `webpki-roots` gives the same built-in root set the
# HTTP clients trust, and `insecure` is what `redis.tls.verify: false`
# lowers to.
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp", "connection-manager", "cluster-async", "sentinel", "tls-rustls-webpki-roots", "tls-rustls-insecure"] }

# Object-storage observability sink (aisix-obs): ONE crate covering S3 / GCS /
# Azure Blob (+ S3-compatible MinIO/R2) behind a single `ObjectStore` trait, so
# the sink is written once, not per-provider. The cloud features pull reqwest
# default-features=false + rustls, so this stays rustls-only — no OpenSSL /
# native-tls (same posture as the SLS sub-crates above).
object_store = { version = "0.13", default-features = false, features = ["aws", "gcp", "azure", "tls-webpki-roots"] }
# NDJSON gzip for the object-storage sink. flate2's default miniz_oxide backend
# is pure Rust — no zlib/C, consistent with the no-OpenSSL posture.
flate2 = "1"

# AWS SDK — kind=bedrock guardrail dispatcher (PRD-09c §6 Phase 2).
# Pulled into aisix-guardrails only; opt-out via `--no-default-features`
# on the crate when the operator never plans to use Bedrock.
#
# `default-https-client` (hyper 1 + rustls 0.23/aws-lc) instead of the
# legacy `rustls` feature: on aws-sdk-bedrockruntime the latter drags the
# retired hyper 0.14 + rustls 0.21 connector (rustls-webpki 0.101, EOL,
# GHSA-xgp8-3hg3-c2mh / GHSA-965h-392x-2mh5) into the build even though every Bedrock
# client is built on `upstream_tls::aws_http_client()` and never uses it.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-credential-types = "1"
aws-smithy-async = { version = "1", features = ["rt-tokio"] }
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
# Lets the Bedrock clients be built on an HTTP stack that carries
# `upstream.tls.ca_file`, instead of the SDK's own default trust store
# (api7/aisix#860). aws-lc matches the process-wide rustls provider
# installed in main().
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-aws-lc"] }

# Test-only
wiremock = "0.6"
testcontainers = "0.28"
tempfile = "3.13"

# Full DWARF is the largest single thing in `target/` here: it is 83% of
# every test binary, and `cargo test --workspace` links 44 of them. Line
# tables keep what a failing test needs while costing much less to emit.
# Measured on one worktree replaying four real commits off main, same
# commands, only this setting varied:
#
#   debug = 2                 42.1 GiB target, 22.0 GiB of test bins
#   debug = line-tables-only  19.8 GiB target,  8.3 GiB of test bins
#
# Timing was measured separately, since a single build run is noisy: a
# clean `cargo test --workspace --no-run`, three runs per setting,
# alternating so machine drift hits both equally, came out at a 92s
# median (90-111s spread) against 70s (70s on every run). So 53% off the
# tree and about a quarter off the wall clock -- emitting debuginfo
# costs both, which is why the two move together rather than trading off.
#
# Panic backtraces keep file and line. On rustc 1.97.1 the frames came
# out identical to `debug = 2`, column included, but treat only file and
# line as durable -- the column is not something to rely on across a
# toolchain bump.
#
# What line tables drop is variable inspection under gdb/lldb: a
# breakpoint still stops and still reports its line, but `print x` finds
# no symbol. Recover it for one build with the same escape hatch
# [profile.release] documents below:
#   CARGO_PROFILE_DEV_DEBUG=2 cargo test -p aisix-proxy
#
# Coverage survives this, but not for the reason [profile.coverage]
# suggests: nothing passes `--profile coverage`, so `cargo llvm-cov`
# builds under this profile too. It reads the `__llvm_covmap` section
# that `-C instrument-coverage` emits, not DWARF, so line-level coverage
# is unaffected -- the coverage gate passes on this commit.
[profile.dev]
debug = "line-tables-only"

# Shipped binaries must stay profileable in the field (perf / cargo
# flamegraph against the very build a user runs), so keep the symbol
# table: function-level flame graphs cost ~10 MiB over stripped. DWARF
# stays out — line tables alone measured ~142 MB here (cgu=1 + thin
# LTO explode inlined-instance records). For an ad-hoc line-level
# build when a deep dive needs file:line attribution:
#   CARGO_PROFILE_RELEASE_DEBUG=line-tables-only \
#   CARGO_PROFILE_RELEASE_STRIP=none cargo build --release
# See issue #847.
[profile.release]
# Fat LTO over thin: cross-crate inlining across the whole graph is a
# measured per-request win on the saturation grid, paid for once per
# release build in link time. Numbers in the PR that flipped it.
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.coverage]
inherits = "dev"
opt-level = 0
debug = 2
incremental = false
